name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Verify & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker Dependencies
        run: |
          cd worker
          npm install

      - name: Verify Worker (tsc & vitest)
        run: |
          cd worker
          npx tsc --noEmit
          npm test

      - name: Install Web Dependencies
        run: |
          cd web
          npm install

      - name: Verify Web (tsc & vitest)
        run: |
          cd web
          npx tsc --noEmit
          npm test

      - name: Build Web Production Bundle
        env:
          VITE_WS_URL: wss://flashdrop-signaling.wick47501.workers.dev
        run: |
          cd web
          npm run build

  deploy-production:
    name: Deploy Production
    needs: [verify]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Cloudflare Credentials
        id: check-creds
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice title=Cloudflare Credentials::CLOUDFLARE_API_TOKEN is not configured in repository secrets. Deploy step skipped."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Worker to Cloudflare
        if: steps.check-creds.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'worker'
          command: deploy

      - name: Build Web for Production
        if: steps.check-creds.outputs.configured == 'true'
        env:
          VITE_WS_URL: wss://flashdrop-signaling.wick47501.workers.dev
        run: |
          cd web
          npm install
          npm run build

      - name: Ensure Cloudflare Pages Project Exists
        if: steps.check-creds.outputs.configured == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'web'
          command: pages project create getflashdrop --production-branch=main

      - name: Deploy Web to Cloudflare Pages
        if: steps.check-creds.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'web'
          command: pages deploy dist --project-name=getflashdrop --branch=main --commit-dirty=true

  deploy-preview:
    name: Deploy Preview
    needs: [verify]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Cloudflare Credentials
        id: check-creds
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice title=Cloudflare Credentials::CLOUDFLARE_API_TOKEN is not configured in repository secrets. Preview deploy skipped."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Build Web for Preview
        if: steps.check-creds.outputs.configured == 'true'
        env:
          VITE_WS_URL: wss://flashdrop-signaling.wick47501.workers.dev
        run: |
          cd web
          npm install
          npm run build

      - name: Ensure Cloudflare Pages Project Exists
        if: steps.check-creds.outputs.configured == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'web'
          command: pages project create getflashdrop --production-branch=main

      - name: Deploy Web Preview to Cloudflare Pages
        if: steps.check-creds.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'web'
          command: pages deploy dist --project-name=getflashdrop --branch=${{ github.head_ref }} --commit-dirty=true
